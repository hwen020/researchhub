server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_host api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_host:8000;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
