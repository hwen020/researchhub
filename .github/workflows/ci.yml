name: ResearchHub CI
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: researchhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: researchhub
          POSTGRES_USER: researchhub
          POSTGRES_PASSWORD: isolated-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchhub"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://researchhub:isolated-ci@localhost/researchhub
      RESEARCHHUB_TEST_DATABASE: postgresql+psycopg://researchhub:isolated-ci@localhost/researchhub
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q researchhub
      - run: alembic upgrade head && alembic check
      - run: python -m pytest -q
      - name: S3 consistency integration
        env:
          RESEARCHHUB_TEST_S3_ENDPOINT: http://127.0.0.1:17070
          RESEARCHHUB_S3_ACCESS_KEY: synthetic-ci-s3
          RESEARCHHUB_S3_SECRET_KEY: synthetic-ci-s3-only
        run: |
          docker run --rm -d --name researchhub-ci-s3 --tmpfs /data -p 127.0.0.1:17070:7070 \
            -e ROOT_ACCESS_KEY="$RESEARCHHUB_S3_ACCESS_KEY" -e ROOT_SECRET_KEY="$RESEARCHHUB_S3_SECRET_KEY" \
            ghcr.io/versity/versitygw:v1.7.0 --port :7070 posix /data
          trap 'docker stop researchhub-ci-s3' EXIT
          python -m pytest -q -k s3_reconciles
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
  compose:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: isolatedci
      RESEARCHHUB_FIXTURE_PASSWORD: synthetic-ci-fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --scale worker=2
      - run: curl --retry 12 --retry-all-errors --retry-delay 2 --fail http://127.0.0.1:8080/api/readyz
      - run: docker compose exec -T -e RESEARCHHUB_FIXTURE_PASSWORD api python - < scripts/seed_browser_fixture.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - run: docker compose down -v
        if: always()
